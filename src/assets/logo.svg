<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470">
  <defs>
    <!-- Clip path for inner shield -->
    <clipPath id="innerShieldClip">
      <path d="M 108,145 Q 154,152 200,162 Q 246,152 292,145 L 292,238 C 292,305 246,346 200,366 C 154,346 108,305 108,238 Z" />
    </clipPath>
  </defs>

  <!-- Outer Shield Background & Border -->
  <path 
    d="M 36,36 L 364,36 L 364,265 C 364,365 292,425 200,446 C 108,425 36,365 36,265 Z" 
    fill="#ffffff" 
    stroke="#000000" 
    stroke-width="7" 
    stroke-linejoin="round"
  />

  <!-- Top Inscriptions (Black Bold Text) -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#000000">
    <text x="200" y="82" font-size="33" font-weight="900" letter-spacing="1.5">GHANATA</text>
    <text x="200" y="112" font-size="20" font-weight="800" letter-spacing="0.5">SENIOR HIGH SCH.</text>
    <text x="200" y="137" font-size="22" font-weight="900" letter-spacing="1">DODOWA</text>
    
    <!-- Year of Establishment: 1936 -->
    <text x="76" y="235" font-size="28" font-weight="900">19</text>
    <text x="324" y="235" font-size="28" font-weight="900">36</text>
  </g>

  <!-- Inner Shield (Clipped Area for Top Yellow & Bottom Green) -->
  <g clip-path="url(#innerShieldClip)">
    <!-- Top Half: Bright Yellow Field -->
    <rect x="90" y="135" width="220" height="120" fill="#facc15" />

    <!-- Bottom Half: Rich Green Field -->
    <rect x="90" y="250" width="220" height="130" fill="#15803d" />

    <!-- Divider Line between Yellow & Green -->
    <line x1="90" y1="250" x2="310" y2="250" stroke="#000000" stroke-width="3" />

    <!-- Blue Lower Half of Central Globe -->
    <circle cx="200" cy="250" r="42" fill="#1d4ed8" stroke="#000000" stroke-width="2.5" />
    <!-- Yellow Upper Half of Central Globe -->
    <path d="M 158,250 A 42 42 0 0 1 242,250 Z" fill="#facc15" stroke="#000000" stroke-width="2.5" />

    <!-- Torch / Flame -->
    <!-- Handle -->
    <polygon points="196,208 204,208 202,280 198,280" fill="#facc15" stroke="#000000" stroke-width="2" />
    <ellipse cx="200" cy="208" rx="10" ry="4" fill="#000000" />
    
    <!-- Red Flame -->
    <g transform="translate(200, 192)">
      <path 
        d="M -26,10 C -24,4 -18,-6 -14,-10 C -10,-14 -12,-22 -8,-28 C -4,-18 2,-24 6,-30 C 10,-24 18,-18 14,-8 C 22,-14 26,-6 24,10 C 20,16 -20,16 -26,10 Z" 
        fill="#dc2626" 
        stroke="#991b1b" 
        stroke-width="1.5"
      />
      <!-- Flame Core Highlights -->
      <path 
        d="M -16,6 C -12,0 -8,-10 -5,-18 C -2,-10 4,-14 6,-20 C 8,-14 14,-8 12,6 Z" 
        fill="#f97316"
      />
      <path 
        d="M -8,6 C -6,2 -4,-4 -2,-10 C 0,-6 4,-8 5,-12 C 6,-8 8,-4 7,6 Z" 
        fill="#fde047"
      />
    </g>

    <!-- Diagonal Black Sash Band -->
    <g transform="rotate(-30, 200, 250)">
      <rect x="110" y="237" width="180" height="26" fill="#000000" stroke="#000000" stroke-width="1" />
      <text 
        x="200" 
        y="256" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" 
        font-weight="900" 
        letter-spacing="2"
      >
        GHANATA
      </text>
    </g>

    <!-- Open Book in Green Field -->
    <g transform="translate(200, 322)">
      <!-- Pages Base (White) -->
      <path 
        d="M 0,0 C -12,-6 -28,-6 -40,0 L -40,18 C -28,12 -12,12 0,18 C 12,12 28,12 40,18 L 40,0 C 28,-6 12,-6 0,0 Z" 
        fill="#ffffff" 
        stroke="#000000" 
        stroke-width="2.5" 
        stroke-linejoin="round"
      />
      <!-- Spine -->
      <line x1="0" y1="0" x2="0" y2="18" stroke="#000000" stroke-width="2.5" />
      <!-- Book Lines (Left Page) -->
      <path d="M -34,4 C -25,-1 -14,-1 -6,4" stroke="#000000" stroke-width="1.5" fill="none" />
      <path d="M -34,8 C -25,3 -14,3 -6,8" stroke="#000000" stroke-width="1.5" fill="none" />
      <path d="M -34,12 C -25,7 -14,7 -6,12" stroke="#000000" stroke-width="1.5" fill="none" />
      <!-- Book Lines (Right Page) -->
      <path d="M 6,4 C 14,-1 25,-1 34,4" stroke="#000000" stroke-width="1.5" fill="none" />
      <path d="M 6,8 C 14,3 25,3 34,8" stroke="#000000" stroke-width="1.5" fill="none" />
      <path d="M 6,12 C 14,7 25,7 34,12" stroke="#000000" stroke-width="1.5" fill="none" />
    </g>
  </g>

  <!-- Inner Shield Outline -->
  <path 
    d="M 108,145 Q 154,152 200,162 Q 246,152 292,145 L 292,238 C 292,305 246,346 200,366 C 154,346 108,305 108,238 Z" 
    fill="none" 
    stroke="#000000" 
    stroke-width="6" 
    stroke-linejoin="round"
  />

  <!-- Bottom Ribbon: CARPE DIEM -->
  <g transform="translate(0, 365)">
    <!-- Ribbon Left Fold / Swallowtail -->
    <polygon points="106,12 86,22 106,32 94,22" fill="#eab308" stroke="#000000" stroke-width="2.5" />
    <polygon points="106,12 106,32 120,24" fill="#ca8a04" stroke="#000000" stroke-width="2" />

    <!-- Ribbon Right Fold / Swallowtail -->
    <polygon points="294,12 314,22 294,32 306,22" fill="#eab308" stroke="#000000" stroke-width="2.5" />
    <polygon points="294,12 294,32 280,24" fill="#ca8a04" stroke="#000000" stroke-width="2" />

    <!-- Ribbon Main Body (Yellow) -->
    <path 
      d="M 100,20 Q 200,38 300,20 L 296,44 Q 200,62 104,44 Z" 
      fill="#facc15" 
      stroke="#000000" 
      stroke-width="3" 
      stroke-linejoin="round"
    />

    <!-- Ribbon Text: CARPE DIEM -->
    <text 
      x="200" 
      y="43" 
      text-anchor="middle" 
      fill="#000000" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
      font-size="19" 
      font-weight="900" 
      letter-spacing="2.5"
    >
      CARPE DIEM
    </text>
  </g>
</svg>
